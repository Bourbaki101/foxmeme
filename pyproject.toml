[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memecam"
version = "0.1.0"
description = "Offline gesture-controlled webcam effects for OBS"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<2", "opencv-contrib-python>=4.10,<4.12", "mediapipe==0.10.21", "PySide6>=6.8,<7", "cv2-enumerate-cameras>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
memecam = "memecam.app:main"

[tool.setuptools.packages.find]
include = ["memecam*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
